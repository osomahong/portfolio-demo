<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #fbf8f3;
    color: #2b2724;
    font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
    word-break: keep-all;
    display: flex;
    align-items: center;
    gap: 64px;
    padding: 0 80px;
    box-sizing: border-box;
  }
  .text { flex: 1; }
  .eyebrow { margin: 0 0 24px; font-size: 24px; font-weight: 600; color: #d9633b; letter-spacing: 0.06em; }
  h1 { margin: 0 0 28px; font-size: 64px; line-height: 1.25; letter-spacing: -0.03em; font-weight: 800; }
  .lead { margin: 0 0 40px; font-size: 28px; line-height: 1.5; color: #6f6760; }
  .url { margin: 0; font-size: 22px; color: #6f6760; padding-top: 24px; border-top: 1px solid #e7e0d6; }
  .art { flex: 0 0 440px; height: 440px; border-radius: 28px; overflow: hidden; border: 1px solid #e7e0d6; }
  .art svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
  <div class="text">
    <p class="eyebrow">FREELANCE ILLUSTRATOR</p>
    <h1>일상의 온도를<br>그림으로 옮기는<br>김하늘입니다</h1>
    <p class="lead">그림책, 출판 표지, 브랜드 일러스트</p>
    <p class="url">osomahong.github.io/portfolio-demo</p>
  </div>
  <div class="art">
    <svg viewBox="50 0 300 300" preserveAspectRatio="xMidYMid slice">
      <rect x="0" width="400" height="300" fill="#2f3a5c"/>
      <circle cx="290" cy="70" r="34" fill="#f6e3b4"/>
      <circle cx="80" cy="50" r="2.5" fill="#fff"/>
      <circle cx="150" cy="90" r="2" fill="#fff"/>
      <circle cx="220" cy="40" r="2.5" fill="#fff"/>
      <circle cx="330" cy="140" r="2" fill="#fff"/>
      <circle cx="70" cy="130" r="2" fill="#fff"/>
      <path d="M0 230 Q120 170 240 210 T400 200 V300 H0 Z" fill="#4d6b5a"/>
      <path d="M0 260 Q140 230 260 255 T400 250 V300 H0 Z" fill="#3c5547"/>
      <circle cx="170" cy="178" r="14" fill="#f1c9a5"/>
      <path d="M156 192 h28 l6 30 h-40 z" fill="#d9633b"/>
      <path d="M200 206 q10 -16 20 0 q2 10 -10 12 q-12 -2 -10 -12 z" fill="#2b2724"/>
      <path d="M203 198 l3 -8 l4 7 M217 198 l-3 -8 l-4 7" stroke="#2b2724" stroke-width="3" fill="#2b2724"/>
    </svg>
  </div>
</body>
</html>
